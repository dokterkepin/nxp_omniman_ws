commander1:
  ros__parameters:
    # Planner selection (the move_group node must have this pipeline loaded at launch).
    planner_pipeline: "pilz_industrial_motion_planner"
    planner_id: "PTP"

    # Offsets added to the "ready" pose. Edit freely — no recompile needed.
    #   dx/dy/dz         : position offset in meters (base frame)
    #   droll/dpitch/dyaw: orientation offset in radians, relative to the ready
    #                      orientation (gripper's own axes). 0 = keep ready orientation.
    # Ready pose (for reference): x=0.326 y=-0.004 z=0.412

    # Pre-grasp: above the object
    pre_grasp.dx:  0.00
    pre_grasp.dy:  0.00
    pre_grasp.dz: -0.05
    pre_grasp.droll:  0.00
    pre_grasp.dpitch: 0.00
    pre_grasp.dyaw:   0.00

    # Grasp: lower to meet the object
    grasp.dx:  0.00
    grasp.dy:  0.00
    grasp.dz: -0.05
    grasp.droll:  0.00
    grasp.dpitch: 0.400
    grasp.dyaw:   0.00

    # Lift: raise back up after closing gripper
    lift.dx:  0.00
    lift.dy:  0.00
    lift.dz: -0.10
    lift.droll:  0.00
    lift.dpitch: 0.00
    lift.dyaw:   0.00

    # Place: move sideways to the drop location
    place.dx:  0.00
    place.dy:  0.00
    place.dz: 0.00
    place.droll:  0.00
    place.dpitch: 0.00
    place.dyaw:   0.00
