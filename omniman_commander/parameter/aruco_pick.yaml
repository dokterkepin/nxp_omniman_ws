commander_aruco:
  ros__parameters:
    # Planner selection (move_group must have this pipeline loaded at launch).
    planner_pipeline: "pilz_industrial_motion_planner"
    planner_id: "PTP"

    # Motion speed (0.0–1.0, fraction of joint_limits.yaml max).
    velocity_scale:     0.3
    acceleration_scale: 0.3

    # The MoveGroup planning frame — marker poses are transformed into this frame
    # before being used as goals. On this robot it is the URDF root "base_footprint".
    planning_frame: "base_footprint"

    # Which ArUco marker to pick (the id printed on the marker).
    marker_id: 0

    # How long DETECT waits for the marker to appear before failing (seconds).
    detect_timeout: 10.0

    # false = grasp with the READY orientation + the offset's RPY (reliable on this
    #         6-DOF arm). true = grasp using the marker's own detected orientation.
    use_marker_orientation: false

    # ---- Offsets (meters / radians) ----
    # droll/dpitch/dyaw overlay the chosen orientation (+dpitch tilts gripper DOWN).

    # Look: tilt wrist down from ready pose so the camera can see the marker.
    look.dx:  0.00
    look.dy:  0.00
    look.dz:  0.00
    look.droll:  0.00
    look.dpitch: 0.500
    look.dyaw:   0.00

    # Offsets below are marker -> WRIST (ee_link), measured by hand: the marker is
    # detected at its face, but the wrist must sit below/behind it for the tilted
    # gripper fingers to reach the cube. Calibrated from a manual grasp:
    #   marker (0.384, -0.012, 0.347) -> wrist (0.357, -0.009, 0.257)

    # Approach: hover 10cm above the grasp point, same x/y.
    approach.dx: -0.10
    approach.dy:  0.000
    approach.dz:  -0.03
    approach.droll:  0.00
    approach.dpitch: -0.700
    approach.dyaw:   0.00

    # Grasp: wrist 9cm below the marker so the tilted fingers reach the cube.
    grasp.dx: 0.000
    grasp.dy:  0.00
    grasp.dz: 0.00
    grasp.droll:  0.000
    grasp.dpitch: 0.000
    grasp.dyaw:   0.000

    # ---- Place: fixed drop location, offset from the READY pose (not the marker) ----
    place.dx:  0.00
    place.dy: -0.15
    place.dz:  0.00
    place.droll:  0.00
    place.dpitch: 0.00
    place.dyaw:   0.00
