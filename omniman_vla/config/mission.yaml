# Mission definition for pick_place_shuttle.py
#
#   home -> pick_area  (nav2)
#           correct    (base_correction policy - fixes nav2's residual error)
#           pick       (pick_place policy)
#   ->     place_area  (nav2)
#           correct    (base_correction policy)
#           place      (pick_place policy, same checkpoint)
#   -> home (nav2)
#
# pick_place_mission.py runs the same mission with visual_align.py as the
# correct step before the pick (none before the place), and ignores the
# base_correction entry below. It hands the robot over through the
# control lock and lets policy_runner.py decide when the arm is finished; the
# arm settings for that are in policy_runner.yaml, not here.
#
# The places (home, pick_area, place_area) are NOT in this file: they live in
# poses.yaml next to it, so the web UI can save them where the robot really is
# without rewriting the comments here.
# Policies are ACT checkpoints; both are 10-dim (7 arm/gripper + 3 base), so
# they can drive the base as well as the arm. That is what makes the base
# correction step possible - nav2 gets close (it leaves up to ~12 cm / ~5.7 deg
# of error), and the policy closes the loop visually, which is not bounded by
# AMCL's ~5 deg yaw uncertainty.

policies:
  # Only pick_place_shuttle.py uses this one. Several versions are trained
  # (omniman_base_correct_v2 .. v5); point this at the one you want.
  base_correction:
    path: /home/dokterkepin/output/omniman_base_correct_v5/checkpoints/last/pretrained_model
    instruction: "correct the base position"
    duration_s: 10.0
  manipulate:
    path: /home/dokterkepin/output/omniman_pick_and_place/checkpoints/last/pretrained_model
    instruction_pick: "pick the object"
    instruction_place: "place the object"
    # Fixed run times, pick_place_shuttle.py only. With pick_place_mission.py
    # policy_runner.py runs the policy until the arm is done.
    pick_duration_s: 500.0
    place_duration_s: 10.0

settings:
  fps: 30
  # pick_place_mission.py: after arriving at pick_area, move the base until the
  # cup is in place in the wrist camera (visual_align.py + cup_detector.py)
  # before starting the pick policy. false = start the pick right away.
  align_before_pick: true
  # After each nav leg the mission waits for wheel odometry to show the base
  # has actually stopped, instead of sleeping a fixed time. still_time_s is how
  # long it must stay stopped; settle_timeout_s gives up if it never does.
  still_time_s: 0.5
  settle_timeout_s: 5.0
