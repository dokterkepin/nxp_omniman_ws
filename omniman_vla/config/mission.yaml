# Mission settings for the missions built on omniman_vla.mission
# (pick_place_bt.py is the worked example):
#
#   home -> pick_area  (nav2)
#           align      (visual_align: base correction on what the detector sees)
#           pick       (policy, until policy_runner sees the arm finished)
#   ->     place_area  (nav2)
#           align, place
#   -> home (nav2)
#
# The places (home, pick_area, place_area) are NOT in this file: they live in
# poses.yaml next to it, so the web UI can save them where the robot really is
# without rewriting the comments here. The arm settings that decide when a
# policy run is finished are in policy_runner.yaml, not here.

policies:
  manipulate:
    path: /home/dokterkepin/output/omniman_pick_and_place/checkpoints/last/pretrained_model
    instruction_pick: "pick the object"
    instruction_place: "place the object"

settings:
  # After arriving at pick_area, move the base until the
  # cup is in place in the wrist camera (visual_align.py + sam_detector.py)
  # before starting the pick policy. false = start the pick right away.
  align_before_pick: true
  # After each nav leg the mission waits for wheel odometry to show the base
  # has actually stopped, instead of sleeping a fixed time. still_time_s is how
  # long it must stay stopped; settle_timeout_s gives up if it never does.
  still_time_s: 0.5
  settle_timeout_s: 5.0
  # "Still" = every odometry speed under these (odometry is never exactly 0).
  # Raise them a little if a stopped base still reads "did not settle".
  still_linear: 0.01       # m/s
  still_angular: 0.02      # rad/s

  # ---- behaviour-tree missions (omniman_vla.mission) ----
  # How long a step waits for a service (visual_align, policy_runner, the
  # lock) to appear before failing with "not answering".
  service_wait_s: 10.0
  # How often the tree is ticked, seconds.
  tick_s: 0.1
  # How often the running step logs one line about what it is waiting for
  # (the tree itself is printed whenever a step's status changes).
  log_every_s: 2.0

  # ---- pick_place_bt.py only ----
  # What visual_align aligns to before the pick / the place. Must be written
  # exactly as one of the active detector's prompts in visual_align.yaml -
  # detections are named after the prompt, and visual_align only accepts the
  # current target. pick_place_bt.py checks this at start and stops if not.
  pick_target: "yellow cup lid"
  place_target: "black square"
  # Align to place_target before the place policy. false = place right away.
  align_before_place: true

# Is the gripper holding something? (grasp_monitor.py - read by the node from
# this file directly; saved edits apply within a second.)
#   holding = position > closed_empty_position  and  |effort| > holding_min_effort
# Observed: open 0.019, fully closed -0.013; closed on the cup the fingers
# never go below -0.002 and the effort reads -20 .. -200; closed on nothing
# the effort is near 0.
grasp_monitor:
  joint_states_topic: /joint_states
  joint: gripper_prismatic_joint
  # Below this the fingers closed past where the cup would stop them: empty.
  closed_empty_position: -0.0025
  # |effort| above this: the servo is pushing against something.
  holding_min_effort: 2
  # Both must hold this long before the state changes (no flicker while the
  # fingers are still moving).
  stable_s: 0.3
