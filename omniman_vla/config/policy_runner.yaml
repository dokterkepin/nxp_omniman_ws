# Parameters for policy_runner.py. Nothing here is task-specific: a caller of
# ~/run can override policy_path and instruction for each run.
policy_runner:
  ros__parameters:
    # Name this runner holds control under (control_arbiter).
    owner_name: policy

    # Defaults when ~/run does not name a policy or instruction.
    policy_path: /home/dokterkepin/output/omniman_pick_and_place_v4/checkpoints/100000/pretrained_model
    instruction: "pick the object"
    fps: 30

    # The arm's home pose (shoulder_yaw, upper_shoulder_pitch, arm_yaw,
    # forearm_pitch, wrist_pitch, palm_yaw), measured at rest. No gripper.
    home_pose: [-0.083, 0.585, -0.000, -1.506, 1.391, -0.042]
    # Every arm joint within this of home_pose counts as "at home"; beyond it,
    # the arm is away. The policy does not return to exactly the same pose:
    # after a place it came to rest 0.118 rad off (upper_shoulder_pitch) and was
    # never seen as home at 0.08. 0.20 covers that with margin, while task poses
    # are much further out. Keep the resting pose well inside it (read "worst
    # joint" in `ros2 topic echo /policy_runner/arm`) - an arm resting near the
    # limit flips in and out of home and never finishes. Raise it if that happens.
    home_tolerance: 0.20
    # Finished = at home for this long in a row (it does not have to have moved:
    # a policy stops moving once the object is picked). Must be longer than any
    # pause at home that is not the end - a reset between grasp attempts, which
    # also passes through home, or a slow start. Read the "left home after Xs"
    # log lines to tune it.
    # Only a default: a mission sets it per step (PolicyStep dwell_s=...);
    # this applies to callers that do not, like the web UI's Policy switch.
    finished_dwell_s: 8.0
    # Give up, and give control back, if inference has not begun by then.
    warmup_timeout_s: 10.0
    # Stop a run that can never finish: the arm never leaves home (the policy
    # does nothing), or never comes back (it keeps reaching for something that
    # is not there). FINISH, release, report idle - a mission then sees the
    # run end and can retry. 0 = no limit (wait for ever).
    run_timeout_s: 120.0
