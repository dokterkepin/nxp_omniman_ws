controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - shoulder_yaw_joint
      - upper_shoulder_pitch_joint
      - arm_yaw_joint
      - forearm_pitch_joint
      - wrist_pitch_joint
      - palm_yaw_joint
      - gripper_prismatic_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_start: true
