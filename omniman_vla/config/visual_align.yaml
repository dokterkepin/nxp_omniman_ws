# Settings for sam_detector.py and visual_align.py - the base correction step
# between Nav2 and the policy: SAM 3 finds the target, visual_align moves the
# base until it sits where the policy expects it.
#
# The nodes read this file directly (not ROS parameters, no --ros-args), each
# its own section below. Save an edit and it applies within a second - no
# restart; only topics, model, half, imgsz and rate_hz are read once at start.
# Note: a node reads the copy of this file on the PC it runs on.

# SAM 3 (sam_detector.py, GPU PC, lerobot_jazzy env). Weights: sam3.pt from
# huggingface.co/facebook/sam3 (gated - request access first).
sam_detector:
  image_topic: /image_raw/compressed
  model: ~/models/sam3.pt
  # Short noun phrases, priority order: the first one in view is aligned to.
  # Tested: "yellow cup lid" (cup), "black square" (the mark). NOT "black
  # mark" - it matches dirt specks all over the box.
  prompts: ["yellow cup lid", "black rectangle"]
  # Minimum score (0-1) for a mask to count.
  conf: 0.5
  # fp16 on the GPU: about half the memory and faster.
  half: true
  # Input size, multiple of 14. 644: ~100 ms a frame; 1008 (native): ~3x slower.
  imgsz: 644

# EfficientSAM3 (efficient_sam_detector.py, GPU PC, effsam3 env) - a lighter,
# distilled SAM 3 to try in place of sam_detector: switch the node in
# control_launch.py, and set visual_align's detections_topic below to
# /efficient_sam_detector/detections (back to /sam_detector/detections for
# SAM 3). Weights: huggingface.co/Simon7108528/EfficientSAM3
# (efficientsam3_ft/). Tested: cup ok, black mark weak - see the node.
efficient_sam_detector:
  image_topic: /image_raw/compressed
  # RV-M (RepViT) was the best for the cup. Others: efficientsam3_efficientvit.pt
  # (backbone_type efficientvit, model_name b1), efficientsam3_tinyvit.pt
  # (tinyvit, 11m).
  model: ~/models/efficientsam3/efficientsam3_ft/efficientsam3_repvit.pt
  backbone_type: repvit
  model_name: m1.1
  # The released checkpoints need exactly this text encoder - with anything
  # else the text weights do not load and nothing is detected.
  text_encoder: MobileCLIP-S0
  text_context_length: 16
  # Input size the model was trained at.
  resolution: 1008
  # Tested: "yellow cup lid" (cup, 20/20). For the mark "black rectangle" was
  # the best wording, but weak - lower conf to ~0.35 for it.
  prompts: ["yellow cup lid", "black rectangle"]
  conf: 0.5

visual_align:
  owner_name: align
  detections_topic: /efficient_sam_detector/detections
  cmd_vel_topic: /cmd_vel
  odom_topic: /mecanum_drive_controller/odometry
  rate_hz: 20.0

  # How to fix the cup's left/right error:
  #   strafe - slide sideways (linear_y). Strafing slips, which moves the
  #            base forward/back too - the forward axis (k_forward) takes
  #            that out, since the cup's y in the image moves with it.
  #   rotate - turn (angular_z). What the base_correct demos did.
  x_correction: rotate

  # Where the cup should end up in the image (640x480), and how close counts
  # as there. After correcting in the base_correct demos the cup sat at
  # x 299-343, y 201-260 (middle half of the episodes).
  aim_x: 320.0
  tolerance_x: 30.0
  aim_y: 300.0
  tolerance_y: 30.0
  # Aligned = this many detections in a row with every axis in tolerance.
  settle_frames: 5
  min_score: 0.3

  # Each axis: speed = k * pixel error, then clamped to [min, max]. Below
  # the min the wheels do not move the base at all - tune on the robot.
  # rotate: rad/s per px
  k_angular: 0.003
  max_angular: 0.5
  min_angular: 0.10
  # strafe: m/s per px of x error
  k_lateral: 0.0005
  max_lateral: 0.08
  # forward/back: m/s per px of y error. 0 = never drive forward or back.
  k_forward: 0.0005
  max_forward: 0.08
  min_linear: 0.02
  # strafe only: hold the heading the cup was first seen at, rad/s per rad
  # of error. 0 = never turn. Nothing else corrects heading, so if strafing
  # slowly twists the base, set 1.0.
  k_heading: 0.0
  tolerance_heading_deg: 2.0

  # Safety: give up if the base ends up this far from where the run started
  # (the arm could reach the box before the cup looks right).
  # 0 = no limit.
  max_travel_m: 0.0

  # When detections drop out (glare, angle, blur) - no searching once seen:
  # detection_timeout_s  older than this = lost: keep aligning on the last
  #                      detection until a new one arrives
  # lost_s               stop and fail after lost this long. 0 = never -
  #                      it would keep driving on the old position for ever.
  #                      Before the target was ever seen (search_time_s 0)
  #                      it is how long to wait for it.
  detection_timeout_s: 0.5
  lost_s: 3.0

  # Not seen yet this run: turn at search_speed (rad/s) for up to
  # search_time_s until a target shows, then align. Not found by then ->
  # stop, "not found". Once seen, a run never searches again.
  # 10 s at 0.3 rad/s is about half a turn.
  # 0 = do not turn: wait lost_s for it instead (lost_s 0 = for ever).
  search_speed: 0.3
  search_time_s: 10.0
  # Which way to search: +1 = left (counter-clockwise), -1 = right.
  search_direction: 1

  # Give up, stop and release control after this long. 0 = no limit.
  timeout_s: 0.0
