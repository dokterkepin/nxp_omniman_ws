bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    # Service-robot tree: no Spin recovery, waits instead of manoeuvring around
    # people, replans at 2 Hz. See the comments in the XML itself.
    default_nav_to_pose_bt_xml: $(find-pkg-share omniman_navigation)/behavior_trees/navigate_to_pose_service_robot.xml
    # MUST also be a Spin-free tree. bt_navigator loads BOTH trees at activation
    # and BtActionNode waits for its action server in the constructor, so a
    # <Spin> node here with "spin" removed from behavior_plugins throws
    # "Action server spin not available", fails the load, and leaves
    # bt_navigator inactive - stalling the entire lifecycle manager.
    default_nav_through_poses_bt_xml: $(find-pkg-share omniman_navigation)/behavior_trees/navigate_through_poses_service_robot.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      # 30 -> 90 s. Nav2 has NO idea the collision monitor has stopped the robot
      # - the BT still believes it is following the path, so this timer keeps
      # counting while a person stands in the way. At 30 s a customer pausing to
      # chat was enough to declare failure and fire a recovery. A service robot
      # should wait for people to move, not start manoeuvring around them.
      movement_time_allowance: 90.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Loosened from 0.05/0.05. A slipping mecanum base cannot settle inside a
      # 5 cm / 2.9 deg window, so it hunts around the goal - and goal-hunting is
      # exactly where it makes the small lateral/oblique corrections we want to
      # avoid. Wider tolerances end the approach cleanly.
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15
      stateful: true
      # (xy_goal_tolerance_buffer removed - not a SimpleGoalChecker parameter,
      #  it was being silently ignored.)

    FollowPath:
      # RotationShim wraps MPPI: when the path heading differs from the robot
      # heading by more than angular_dist_threshold, it rotates in place first,
      # then hands control to MPPI. This structurally removes oblique departures
      # instead of just penalising them via critic weights.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.40
      forward_sampling_distance: 0.40
      rotate_to_heading_angular_vel: 0.40
      max_angular_accel: 0.8
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      closed_loop: false

      # --- MPPI (the primary controller, configured in this same namespace) ---
      time_steps: 56
      model_dt: 0.05
      # 3000 -> 2000: buys CPU headroom to hold 20 Hz (see CostCritic below).
      batch_size: 2000
      vx_std: 0.2
      # 0.05 -> 0.02. Sampling std must sit well below vy_max, otherwise nearly
      # every sample saturates the lateral limit and MPPI still explores lateral
      # motion aggressively - just bounded.
      vy_std: 0.02
      wz_std: 0.4
      vx_max: 0.2
      vx_min: -0.15
      vy_max: 0.06
      wz_max: 0.25
      motion_model: "Omni"
      # NOTE: Humble's MPPI has NO acceleration constraints. Its ControlConstraints
      # struct is {vx_max, vx_min, vy, wz} only - ax_max/ax_min/ay_max/ay_min/az_max
      # were added in Iron and were silently discarded here. Acceleration limiting
      # is done by velocity_smoother instead (see the velocity_smoother block).
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
      GoalCritic:
        cost_weight: 8.0
        threshold_to_consider: 2.0
      GoalAngleCritic:
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 5
      PathFollowCritic:
        cost_weight: 12.0
        offset_from_furthest: 5
      PathAngleCritic:
        # This is the real anti-strafe lever: it penalises heading misalignment
        # with the path, pushing the robot to point where it is going. Weight
        # doubled and the allowed heading error tightened from the 1.2 rad
        # default to 0.8 rad (~46 deg).
        cost_weight: 8.0
        offset_from_furthest: 4
        max_angle_to_furthest: 0.8
      PreferForwardCritic:
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        cost_weight: 3.81
        critical_cost: 300.0
        # true -> false. At 2000 batch x 56 steps this was ~112k full footprint
        # collision checks per iteration at 20 Hz. With inflation_radius now set
        # correctly (> circumscribed radius) the inflation gradient carries the
        # obstacle cost, so per-point lookup is enough.
        consider_footprint: false
      ConstraintCritic:
        cost_weight: 4.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # Raised from 0.05 as a direct consequence of the larger inflation_radius:
      # with a 0.45 m inflation, a goal set close to a wall falls in inflated
      # space and NavFn would fail to plan at all with a 5 cm tolerance.
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # "spin" REMOVED deliberately. Recovery behaviours publish straight to
    # /cmd_vel, bypassing both the velocity smoother and the collision monitor -
    # so a spin recovery rotates the robot blind, and the single situation most
    # likely to trigger it is a person standing in front of the robot. A service
    # robot that is blocked should wait, not pirouette next to a customer.
    #
    # "backup" is kept as the last way out of a genuine trap, but note it is
    # equally ungated: it reverses without collision checking. It only runs
    # after "wait" has already failed.
    behavior_plugins: ["backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Recovery behaviours publish straight to /cmd_vel and bypass the velocity
    # smoother, so their limits must be gentle on their own. A 1.0 rad/s spin
    # with 2.0 rad/s^2 accel would slip the wheels and wreck the AMCL estimate
    # at exactly the moment localisation is already struggling.
    max_rotational_vel: 0.6
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.0

map_server:
  ros__parameters:
    yaml_filename: ""

amcl:
  ros__parameters:
    alpha1: 0.4
    alpha2: 1.5
    alpha3: 2.0
    alpha4: 0.8
    alpha5: 2.0
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 3000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

local_costmap:
  local_costmap:
    ros__parameters:
      # 5.0 -> 10.0 Hz. Nav2 does not track or predict moving obstacles; every
      # scan is a static snapshot, so avoidance is purely reactive and update
      # rate IS the responsiveness. At 5 Hz a person walking 1.4 m/s moved 28 cm
      # between costmap updates. /scan arrives at ~13.5 Hz, so 10 Hz is the
      # useful ceiling here.
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Measured in SolidWorks from the defined base origin. The base is
      # symmetric in both axes: x = +/-0.127, y = +/-0.160. base_footprint ->
      # base_link is "0 0 0.09" (pure Z), so base_link measurements apply
      # directly here. Replaces an earlier asymmetric guess of
      # [[0.24, 0.20], [0.24, -0.20], [-0.18, -0.20], [-0.18, 0.20]].
      footprint: "[[0.127, 0.160], [0.127, -0.160], [-0.127, -0.160], [-0.127, 0.160]]"
      plugins: ["obstacle_layer", "inflation_layer"] # inflation robot will stop it saw itself nearthis parameter
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          # /scan_filtered comes from the stock laser_filters chain
          # (config/scan_filter.yaml): robot-outline polygon + speckle removal.
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          # 0.45 -> 0.16 (lidar range_min is 0.15). The old 0.45 discarded every
          # return closer than 45 cm while the footprint reaches 24 cm forward,
          # leaving a ~20 cm blind ring at the robot's skin - precisely where a
          # person stepping in front of it would stand. It also blocked CLEARING
          # in that ring, so it was blind in both directions.
          raytrace_min_range: 0.16
          obstacle_max_range: 10.0
          obstacle_min_range: 0.16
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Must exceed the circumscribed radius or the inflation layer cannot
        # produce a usable cost gradient. With the measured footprint that is
        # sqrt(0.127^2 + 0.160^2) = 0.204 m - considerably smaller than the
        # 0.31 m implied by the earlier guessed footprint, so this comes down
        # from 0.45 and is less likely to make doorways unplannable.
        inflation_radius: 0.35
      always_send_full_costmap: true

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Velocity caps match the MPPI constraints. Angular is left at 0.5 (above
    # MPPI's wz_max 0.25) so RotationShim's 0.40 rad/s in-place turn is not clipped.
    max_velocity: [0.2, 0.06, 0.5]
    min_velocity: [-0.15, -0.06, -0.5]
    # THIS is now the only acceleration limiter in the whole stack, because
    # Humble's MPPI has no acceleration constraints at all. Previously nothing
    # limited acceleration anywhere: MPPI could step 0 -> 0.2 m/s in one 50 ms
    # tick, which breaks mecanum traction on an uneven floor. Ramped down hard.
    max_accel: [0.3, 0.15, 0.8]
    # Deceleration is allowed to be stronger than acceleration for stopping
    # distance, but still far below the old -1.0/-2.0.
    max_decel: [-0.5, -0.25, -1.2]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]

# Independent safety layer. Reads the laser DIRECTLY and vetoes velocity
# commands - it does not consult the costmap, the planner or the controller, so
# it still works when those are stale, wrong, or busy. Sits at the very end of
# the cmd_vel chain:
#
#   controller_server -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed
#                                          -> collision_monitor -> cmd_vel
#
# NOTE: it consumes /scan_filtered, NOT /scan. The collision monitor's scan
# source has no range filtering whatsoever, so the robot's own structure at
# ~0.19 m would sit inside PolygonStop and latch a permanent emergency stop.
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    # NOTE: no state_topic here. This Humble build publishes no monitor-state
    # topic (that was added in a later Nav2 release), so the parameter would be
    # silently ignored. To see what the monitor is doing, watch the polygon
    # topics below in RViz, or compare /cmd_vel_smoothed against /cmd_vel.
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Graduated deceleration, then a direction-aware stop:
    #
    #   1.00 m -> 65% speed    (barely perceptible, reads as "being careful")
    #   0.60 m -> 35% speed
    #   predicted collision within 1.5 s -> stop
    #   plus a tight static box as a last-resort backstop
    #
    # Zones are evaluated in listed order and the most restrictive action wins.
    #
    # WHY APPROACH RATHER THAN A STATIC STOP BOX:
    # The first version used a box reaching 0.38 m forward and +/-0.26 laterally
    # while the footprint is only +/-0.20 wide. Measured on the robot, 83% of the
    # points triggering a stop were BESIDE the footprint (y between -0.259 and
    # -0.222), never ahead of it - i.e. objects the robot was squeezing past and
    # could not possibly hit while driving straight. The robot stalled 0.24 m
    # short of its goal because a static box cannot tell "in my path" from
    # "beside me".
    #
    # "approach" projects the ACTUAL footprint forward along the current
    # velocity and stops only if a collision is genuinely predicted, so passing
    # close alongside furniture no longer halts the robot.
    polygons: ["FootprintApproach", "PolygonStop", "PolygonSlowNear", "PolygonSlowFar"]

    # Direction-aware primary stop. Uses the real footprint from the costmap,
    # simulated forward along the commanded velocity.
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.05
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_approach"
      enabled: true

    # Points are a FLAT [x1,y1, x2,y2, ...] array in this Humble build, and the
    # threshold parameter is max_points (newer Nav2 renamed it to min_points and
    # switched to a nested string - neither works here).
    #
    # Last-resort backstop for anything "approach" misses (a sensor glitch, or
    # an obstacle appearing inside the prediction horizon).
    #
    # Measured footprint is x: +/-0.127, y: +/-0.160 (SolidWorks, symmetric).
    # Against that, this zone clears the chassis by ~5 cm on the flanks and
    # ~7 cm at the rear, and reaches 0.30 m forward. At vx_max 0.2 m/s and
    # max_decel 0.5 m/s^2 the stopping distance is only ~4 cm, so the forward
    # margin is generous. Note these numbers were originally chosen against a
    # larger guessed footprint, so they are now more conservative than intended
    # rather than tighter - safe, but worth revisiting if the robot proves shy.
    PolygonStop:
      type: "polygon"
      points: [0.30, 0.21, 0.30, -0.21, -0.20, -0.21, -0.20, 0.21]
      action_type: "stop"
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true

    # Slowdown zones stay boxes on purpose - easing off when something is close
    # alongside is CORRECT for a service robot squeezing past a table. They are
    # narrowed from the first version (was +/-0.38 and +/-0.50) so the robot
    # does not crawl at 35% every time it passes furniture.
    PolygonSlowNear:
      type: "polygon"
      points: [0.60, 0.30, 0.60, -0.30, -0.24, -0.30, -0.24, 0.30]
      action_type: "slowdown"
      slowdown_ratio: 0.35
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_slowdown_near"
      enabled: true

    PolygonSlowFar:
      # Rear extent pulled in from -0.26 to -0.20. This is a judgement call, not
      # a bug fix: a zone reaching 13 cm behind a robot that almost always drives
      # forward mostly just triggers when reversing near furniture. -0.20 still
      # clears the chassis rear (-0.127) by 7 cm.
      #
      # (An earlier version of this comment justified the change by claiming
      # fixed structure sat ~12 cm behind the base. That was wrong - those
      # returns were environment, confirmed by scan_origin_test.py: they came
      # and went while the robot drove, which robot-mounted structure cannot do.)
      type: "polygon"
      points: [1.00, 0.36, 1.00, -0.36, -0.20, -0.36, -0.20, 0.36]
      action_type: "slowdown"
      slowdown_ratio: 0.65
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_slowdown_far"
      enabled: true

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_filtered"
      enabled: true

global_costmap:
  global_costmap:
    ros__parameters:
      # 1.0 -> 2.0 Hz. The global obstacle_layer marks people into the global
      # map; at 1 Hz they cleared slowly and left phantom trails that the
      # planner detoured around long after the person had walked away.
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      # Measured in SolidWorks from the defined base origin. The base is
      # symmetric in both axes: x = +/-0.127, y = +/-0.160. base_footprint ->
      # base_link is "0 0 0.09" (pure Z), so base_link measurements apply
      # directly here. Replaces an earlier asymmetric guess of
      # [[0.24, 0.20], [0.24, -0.20], [-0.18, -0.20], [-0.18, 0.20]].
      footprint: "[[0.127, 0.160], [0.127, -0.160], [-0.127, -0.160], [-0.127, 0.160]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          # /scan_filtered comes from the stock laser_filters chain
          # (config/scan_filter.yaml): robot-outline polygon + speckle removal.
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          # 0.45 -> 0.16 (lidar range_min is 0.15). The old 0.45 discarded every
          # return closer than 45 cm while the footprint reaches 24 cm forward,
          # leaving a ~20 cm blind ring at the robot's skin - precisely where a
          # person stepping in front of it would stand. It also blocked CLEARING
          # in that ring, so it was blind in both directions.
          raytrace_min_range: 0.16
          obstacle_max_range: 10.0
          obstacle_min_range: 0.16
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Must exceed the circumscribed radius or the inflation layer cannot
        # produce a usable cost gradient. With the measured footprint that is
        # sqrt(0.127^2 + 0.160^2) = 0.204 m - considerably smaller than the
        # 0.31 m implied by the earlier guessed footprint, so this comes down
        # from 0.45 and is less likely to make doorways unplannable.
        inflation_radius: 0.35
      always_send_full_costmap: true
