bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    # Wheel odometry straight from ros2_control. rf2o and the EKF are gone;
    # mecanum_drive_controller is the sole odometry source and publishes
    # odom -> base_footprint itself (enable_odom_tf: true).
    odom_topic: /mecanum_drive_controller/odometry
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      # 30 -> 90 s. Nav2 has NO idea the collision monitor has stopped the robot
      # - the BT still believes it is following the path, so this timer keeps
      # counting while a person stands in the way. At 30 s a customer pausing to
      # chat was enough to declare failure and fire a recovery. A service robot
      # should wait for people to move, not start manoeuvring around them.
      movement_time_allowance: 90.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Loosened from 0.05/0.05. A slipping mecanum base cannot settle inside a
      # 5 cm / 2.9 deg window, so it hunts around the goal - and goal-hunting is
      # exactly where it makes the small lateral/oblique corrections we want to
      # avoid. Wider tolerances end the approach cleanly.
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15
      stateful: true
      # (xy_goal_tolerance_buffer removed - not a SimpleGoalChecker parameter,
      #  it was being silently ignored.)

    FollowPath:
      # RotationShim wraps MPPI: when the path heading differs from the robot
      # heading by more than angular_dist_threshold, it rotates in place first,
      # then hands control to MPPI. This structurally removes oblique departures
      # instead of just penalising them via critic weights.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.40
      forward_sampling_distance: 0.40
      rotate_to_heading_angular_vel: 0.40
      max_angular_accel: 0.8
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      closed_loop: false

      # --- MPPI (the primary controller, configured in this same namespace) ---
      time_steps: 56
      model_dt: 0.05
      # 3000 -> 2000: buys CPU headroom to hold 20 Hz (see CostCritic below).
      batch_size: 2000
      vx_std: 0.2
      # 0.05 -> 0.02. Sampling std must sit well below vy_max, otherwise nearly
      # every sample saturates the lateral limit and MPPI still explores lateral
      # motion aggressively - just bounded.
      vy_std: 0.05
      wz_std: 0.4
      vx_max: 0.2
      vx_min: -0.15
      vy_max: 0.12
      wz_max: 0.25
      motion_model: "Omni"
      # NOTE: Humble's MPPI has NO acceleration constraints. Its ControlConstraints
      # struct is {vx_max, vx_min, vy, wz} only - ax_max/ax_min/ay_max/ay_min/az_max
      # were added in Iron and are silently discarded here. mecanum_drive_controller
      # has no acceleration limits either, so with velocity_smoother removed there
      # is no acceleration limiting anywhere in the stack: a commanded step from
      # 0 to vx_max reaches the wheels in a single 50 ms tick.
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
      GoalCritic:
        cost_weight: 8.0
        threshold_to_consider: 2.0
      GoalAngleCritic:
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 5
      PathFollowCritic:
        cost_weight: 12.0
        offset_from_furthest: 5
      PathAngleCritic:
        # This is the real anti-strafe lever: it penalises heading misalignment
        # with the path, pushing the robot to point where it is going. Weight
        # doubled and the allowed heading error tightened from the 1.2 rad
        # default to 0.8 rad (~46 deg).
        cost_weight: 8.0
        offset_from_furthest: 4
        max_angle_to_furthest: 0.8
      PreferForwardCritic:
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        cost_weight: 3.81
        critical_cost: 300.0
        # true -> false. At 2000 batch x 56 steps this was ~112k full footprint
        # collision checks per iteration at 20 Hz. With inflation_radius now set
        # correctly (> circumscribed radius) the inflation gradient carries the
        # obstacle cost, so per-point lookup is enough.
        consider_footprint: false
      ConstraintCritic:
        cost_weight: 4.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # Raised from 0.05 as a direct consequence of the larger inflation_radius:
      # with a 0.45 m inflation, a goal set close to a wall falls in inflated
      # space and NavFn would fail to plan at all with a 5 cm tolerance.
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # "spin" is required: Nav2's stock behaviour tree contains a <Spin> node, and
    # bt_navigator fails to load (leaving the whole lifecycle manager stalled) if
    # the matching action server does not exist.
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Recovery behaviours publish straight to /cmd_vel and bypass the velocity
    # smoother, so their limits must be gentle on their own. A 1.0 rad/s spin
    # with 2.0 rad/s^2 accel would slip the wheels and wreck the AMCL estimate
    # at exactly the moment localisation is already struggling.
    max_rotational_vel: 0.6
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.0

map_server:
  ros__parameters:
    yaml_filename: ""

amcl:
  ros__parameters:
    alpha1: 0.4
    alpha2: 1.5
    alpha3: 2.0
    alpha4: 0.8
    alpha5: 2.0
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 3000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

local_costmap:
  local_costmap:
    ros__parameters:
      # 5.0 -> 10.0 Hz. Nav2 does not track or predict moving obstacles; every
      # scan is a static snapshot, so avoidance is purely reactive and update
      # rate IS the responsiveness. At 5 Hz a person walking 1.4 m/s moved 28 cm
      # between costmap updates. /scan arrives at ~13.5 Hz, so 10 Hz is the
      # useful ceiling here.
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Measured in SolidWorks from the defined base origin. The base is
      # symmetric in both axes: x = +/-0.127, y = +/-0.160. base_footprint ->
      # base_link is "0 0 0.09" (pure Z), so base_link measurements apply
      # directly here. Replaces an earlier asymmetric guess of
      # [[0.24, 0.20], [0.24, -0.20], [-0.18, -0.20], [-0.18, 0.20]].
      # Circular footprint. robot_radius and footprint are mutually exclusive -
      # if "footprint" is set to a non-empty polygon it WINS and robot_radius is
      # ignored, so the polygon line must be removed, not just commented beside it.
      #
      # 0.204 m = the polygon's circumscribed radius, sqrt(0.127^2 + 0.160^2),
      # i.e. the smallest circle that fully contains the real chassis.
      footprint: "[[0.127, 0.160], [0.127, -0.160], [-0.127, -0.160], [-0.127, 0.160]]"
      plugins: ["obstacle_layer", "keepout_filter", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          # Raw scan. No filtering is needed: the lidar sits at
          # (-0.070, 0, 0.167) and the chassis rear edge is only 0.057 m from
          # it - well inside the sensor's 0.15 m range_min - so the robot
          # cannot see any part of itself. Verified live: 520 consecutive
          # scans with zero returns under 0.45 m.
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          # 0.45 -> 0.16 (lidar range_min is 0.15). The old 0.45 discarded every
          # return closer than 45 cm while the footprint reaches 24 cm forward,
          # leaving a ~20 cm blind ring at the robot's skin - precisely where a
          # person stepping in front of it would stand. It also blocked CLEARING
          # in that ring, so it was blind in both directions.
          raytrace_min_range: 0.16
          obstacle_max_range: 10.0
          obstacle_min_range: 0.16
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        # Must exceed the circumscribed radius or the inflation layer cannot
        # produce a usable cost gradient. With the measured footprint that is
        # sqrt(0.127^2 + 0.160^2) = 0.204 m - considerably smaller than the
        # 0.31 m implied by the earlier guessed footprint, so this comes down
        # from 0.45 and is less likely to make doorways unplannable.
        inflation_radius: 0.25
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      # 1.0 -> 2.0 Hz. The global obstacle_layer marks people into the global
      # map; at 1 Hz they cleared slowly and left phantom trails that the
      # planner detoured around long after the person had walked away.
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      # Measured in SolidWorks from the defined base origin. The base is
      # symmetric in both axes: x = +/-0.127, y = +/-0.160. base_footprint ->
      # base_link is "0 0 0.09" (pure Z), so base_link measurements apply
      # directly here. Replaces an earlier asymmetric guess of
      # [[0.24, 0.20], [0.24, -0.20], [-0.18, -0.20], [-0.18, 0.20]].
      # Circular footprint. robot_radius and footprint are mutually exclusive -
      # if "footprint" is set to a non-empty polygon it WINS and robot_radius is
      # ignored, so the polygon line must be removed, not just commented beside it.
      #
      # 0.204 m = the polygon's circumscribed radius, sqrt(0.127^2 + 0.160^2),
      # i.e. the smallest circle that fully contains the real chassis.
      footprint: "[[0.127, 0.160], [0.127, -0.160], [-0.127, -0.160], [-0.127, 0.160]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "keepout_filter", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          # Raw scan. No filtering is needed: the lidar sits at
          # (-0.070, 0, 0.167) and the chassis rear edge is only 0.057 m from
          # it - well inside the sensor's 0.15 m range_min - so the robot
          # cannot see any part of itself. Verified live: 520 consecutive
          # scans with zero returns under 0.45 m.
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          # 0.45 -> 0.16 (lidar range_min is 0.15). The old 0.45 discarded every
          # return closer than 45 cm while the footprint reaches 24 cm forward,
          # leaving a ~20 cm blind ring at the robot's skin - precisely where a
          # person stepping in front of it would stand. It also blocked CLEARING
          # in that ring, so it was blind in both directions.
          raytrace_min_range: 0.16
          obstacle_max_range: 10.0
          obstacle_min_range: 0.16
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Must exceed the circumscribed radius or the inflation layer cannot
        # produce a usable cost gradient. With the measured footprint that is
        # sqrt(0.127^2 + 0.160^2) = 0.204 m - considerably smaller than the
        # 0.31 m implied by the earlier guessed footprint, so this comes down
        # from 0.45 and is less likely to make doorways unplannable.
        inflation_radius: 0.25
      always_send_full_costmap: true

# --- Keepout filter support -------------------------------------------------
#
# The KeepoutFilter plugin does NOT read the mask image directly. It subscribes
# to /costmap_filter_info, which tells it which topic carries the mask and how
# to interpret its pixel values. So two extra nodes are needed:
#
#   keepout_mask.yaml -> filter_mask_server -> /keepout_filter_mask
#                                                     ^
#   costmap_filter_info_server -> /costmap_filter_info |
#                                        -> KeepoutFilter in both costmaps
#
# Both are lifecycle nodes and must appear in a lifecycle manager's node_names.

costmap_filter_info_server:
  ros__parameters:
    type: 0                                   # 0 = keepout / lanes filter
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

filter_mask_server:
  ros__parameters:
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    yaml_filename: ""                         # set from the launch file
