# physical_ai_server config for omniman_vla (leader-follower teleop + mecanum base).
#
# Data model (see data_processing/data_converter.py):
#   action                   <- leader*  topics  (what to do next)
#   observation.state        <- follower* topics (what the robot IS doing)
#   observation.images.<cam> <- a CompressedImage topic
#
# ONE config for recording. physical_ai_server CANNOT record state and action
# with different dimensions -- _create_dataset() builds BOTH from the same
# total_joint_order (the concatenation of joint_order), so every recording is
# N-in / N-out. Per-policy shapes are produced afterwards by slicing the parquet
# (omniman_vla/scripts/slice_dataset.py), which needs no re-recording:
#     recorded      state 10 / action 10
#       -> arm      state  7 / action  7
#       -> base     state  7 / action  3
#
# WHY follower_mobile:/odom IS ABSENT
# Measured base velocity reaches the commanded value in ~1 frame (33 ms), so
# observation and action are ~99% the same signal. The network then learns
# "echo the observation", which is right 99.7% of the frames where the robot is
# stopped -- and at inference that is a fixed point it can never leave, so the
# wheels never turn. Base velocity belongs in the ACTION only, as in Mobile
# ALOHA (arXiv 2401.02117). Note ROBOTIS's ffw_sg2 config and LeKiwi both put it
# in the observation, but neither ships evidence of learning base motion --
# ROBOTIS's own published datasets are all stationary ffw_bg2.
#
# WHY THE ARM STAYS IN, even for a base-only policy
# joint_order doubles as the name filter for /joint_states, and the wrist camera
# is mounted on palm_link so it MOVES with the arm. Without the joint angles the
# image cannot be interpreted (is the table far, or is the arm just tucked in?).
# A base-only joint_order would also match nothing in /joint_states and yield a
# silently EMPTY observation.state.
physical_ai_server:
  ros__parameters:
    omniman:
      observation_list:
        - cam
        - state

      camera_topic_list:
        - cam:/image_raw/compressed

      joint_topic_list:
        - follower:/joint_states
        - leader:/leader/joint_trajectory
        - leader_mobile:/cmd_vel

      joint_list:
        - leader
        - leader_mobile

      # Order matters: total_joint_order is these lists concatenated, and it
      # defines both the action layout and the /joint_states name filter.
      joint_order:
        leader:
          - shoulder_yaw_joint
          - upper_shoulder_pitch_joint
          - arm_yaw_joint
          - forearm_pitch_joint
          - wrist_pitch_joint
          - palm_yaw_joint
          - gripper_prismatic_joint
        # /cmd_vel is a Twist (BODY-frame velocity), not per-wheel commands.
        # twist2tensor_array ignores these names and always emits exactly
        # [linear.x, linear.y, angular.z] -- but the LENGTH sets the declared
        # feature shape and the inference slice width, so it must be 3.
        leader_mobile:
          - linear_x
          - linear_y
          - angular_z
