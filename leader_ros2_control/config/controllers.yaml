/**:
  controller_manager:
    ros__parameters:
      update_rate: 200  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      position_controller:
        type: position_controllers/JointGroupPositionController

  position_controller:
    ros__parameters:
      joints:
        - shoulder_yaw_joint
        - upper_shoulder_pitch_joint
        - arm_yaw_joint
        - forearm_pitch_joint
        - wrist_pitch_joint
        - palm_yaw_joint
        - gripper_prismatic_joint
