# Pre-commit hooks for the NXP Omniman workspace.
#
# SCOPE: this repo tracks ~30 vendored upstream ROS packages as plain files
# (not submodules). Linting them would produce thousands of findings in code we
# do not own and cannot fix without diverging from upstream, so they are
# excluded below. moveit_config/ is excluded too: it is generated by the MoveIt
# Setup Assistant, and reformatting it would create a huge spurious diff the
# next time it is regenerated.
#
# Usage:
#   pre-commit install           # activate the git hook (one time)
#   pre-commit run --all-files   # check everything now
#   git commit --no-verify       # bypass in an emergency

exclude: |
  (?x)^(
    cybergear_hardware/|
    dynamixel_hardware/|
    moveit_servo/|
    open_manipulator/|
    physical_ai_tools/|
    rf2o_laser_odometry/|
    rplidar_ros/|
    moveit_config/
  )

repos:
  # ---------------------------------------------------------------- hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]

      # Catches a malformed controllers/params YAML before it fails at launch.
      - id: check-yaml

      # check-xml only looks at *.xml by default; the robot model lives in
      # .xacro/.urdf files, which are valid XML and worth syntax-checking too.
      - id: check-xml
        types: [file]
        files: \.(xml|xacro|urdf|sdf)$

  # ---------------------------------------------------------------- C++
  # Pinned to 14.x to match the clang-format already installed on this machine,
  # so the editor and the hook never disagree about formatting.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v14.0.6
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # ---------------------------------------------------------------- Python
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8

  # Type checking. Scoped to hand-written node scripts only: launch files are
  # declarative builders where mypy finds nothing but costs time on every commit.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [--config-file=mypy.ini]
        files: ^(omniman_hand_teleop|omniman_navigation)/scripts/.*\.py$
