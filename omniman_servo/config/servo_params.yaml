###############################################
# MoveIt Servo config for NXP OmniMan arm
# Tuned conservatively for REAL HARDWARE
###############################################
use_gazebo: false

## Properties of incoming commands
command_in_type: "unitless"  # [-1:1] range, as from joystick
scale:
  # Start slow — increase once movements feel predictable
  linear: 0.1    # m/s max linear velocity
  rotational: 0.2  # rad/s max angular velocity
  joint: 3.0    # max joint velocity scale (needs to be high enough for Dynamixel deadband)

## Properties of outgoing commands
publish_period: 0.02  # 50 Hz (matches well with 500 Hz controller update rate)
low_latency_mode: false

# Output to JointTrajectoryController
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

## Smoothing plugin
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

# move_group runs on robot PC, servo subscribes to its planning scene via DDS
is_primary_planning_scene_monitor: false

## MoveIt properties
move_group_name: arm
planning_frame: base_link
ee_frame_name: ee_link
robot_link_command_frame: base_link

## Stopping behaviour
incoming_command_timeout: 0.1
num_outgoing_halt_msgs_to_publish: 4

## Singularity and joint limits
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
joint_limit_margin: 0.1
leaving_singularity_threshold_multiplier: 2.0

## Topics
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status
command_out_topic: /arm_controller/joint_trajectory

## Collision checking
check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
