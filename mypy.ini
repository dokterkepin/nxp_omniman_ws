[mypy]
python_version = 3.10

# ROS 2 (rclpy, *_msgs), OpenCV and MediaPipe ship no type stubs and no
# py.typed marker. Without this, mypy emits ~22 "missing library stubs"
# errors and finds nothing else. This silences the noise, not real findings.
ignore_missing_imports = True

# The important one. By default mypy only checks the bodies of *annotated*
# functions -- and this codebase is almost entirely unannotated, so without
# this mypy would silently check nothing and always report success.
check_untyped_defs = True

# Catch dead code after a return/raise.
warn_unreachable = True
warn_redundant_casts = True
warn_unused_ignores = True

# Scripts are run directly (ros2 run), not imported as a package, so several
# share no common module root. Without this mypy errors on duplicate basenames.
explicit_package_bases = True
namespace_packages = True

# Not enforcing annotations -- this config finds real bugs in untyped code
# rather than nagging for type hints that add little on 500 lines of scripts.
disallow_untyped_defs = False
disallow_incomplete_defs = False
